name: Build OPPO K9 Pro PEYM00 (NonGKI v2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    name: OPPO K9 Pro / ColorOS 13 / Linux 4.19
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      DEVICE_NAME: "oppo_k9pro_cn"
      DEVICE_CODENAME: "peym00"

      CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
      EXTRA_CMDS: "LD=ld.lld"

      # OPPO K9 Pro MT6893 kernel
      KERNEL_SOURCE: "https://github.com/wirsnow/android_kernel_mtk6893_sukisu.git"
      KERNEL_BRANCH: "sukisu-dev"

      # Keep the toolchains from the existing working build
      CLANG_SOURCE: "https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078.git"
      CLANG_BRANCH: "10.0"

      GCC_GNU: "false"
      GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
      GCC_64_BRANCH: ""
      GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
      GCC_32_BRANCH: ""

      DEFCONFIG_SOURCE: ""
      DEFCONFIG_NAME: "mtk6893_defconfig"
      DEFCONFIG_ORIGIN_IMAGE: ""
      DEFCONFIG_FROM_BOOT: "false"

      # Install SukiSU using the framework's built-in setup
      KERNELSU_SOURCE: ""
      KERNELSU_BRANCH: ""
      KERNELSU_AUTO_GET: "true"
      KERNELSU_AUTO_FORK: "sukisu"
      KERNELSU_METHOD: "shell"

      # The selected kernel source contains SUSFS v1.5.7 integration.
      # Do not run the framework's generic SUSFS v2.2 patch action.
      SUSFS_ENABLE: "true"
      SUSFS_FIXED: "false"

      AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
      AK3_BRANCH: "master"
      BOOT_SOURCE: ""

      NEED_DTBO: "false"
      NEED_SAFE_DTBO: "false"
      ROM_TEXT: "coloros13_a13_sukisu_susfs157"

      PYTHON_VERSION: "3"
      PACK_METHOD: "AnyKernel3"
      PACK_KMODULES: "false"

      PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
      PATCHES_BRANCH: "main"
      SUSFS_FOLDER_FIXED: ""
      SUSFS_PATCH_FIXED: ""

      REKERNEL_ENABLE: "false"
      DROIDSPACES_ENABLE: "false"
      NOMOUNT_ENABLE: "false"
      HOOK_METHOD: "syscall"

      # Conservative initial build: disable experimental KPM hooks
      KPM_ENABLE: "false"
      KPM_INLINE: "false"
      KPM_KPATCH_NEXT: "false"
      KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

      BASEBAND_GUARD_ENABLE: "false"
      BASEBAND_GUARD_BOOT: "false"
      GENERATE_DTB: "false"
      GENERATE_CHIP: "mediatek"

      BUILD_DEBUGGER: "true"
      SKIP_PATCH: "false"
      BUILD_OTHER_CONFIG: "false"
      MERGE_CONFIG_FILES: ""
      FREE_MORE_SPACE: "false"

    steps:
      # Check out the NonGKI v2 framework into the workspace root.
      # Its composite actions are called through local paths below.
      - name: Checkout NonGKI Kernel Build v2
        uses: actions/checkout@v4
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: c8aa2399d72135bf66e241eed0c456c221901c83
          persist-credentials: false

      # Keep the kernel's existing SUSFS source; remove only old KernelSU
      # directories before the framework installs SukiSU.
      - name: Preserve existing SUSFS v1.5.7 integration
        shell: bash
        run: |
          set -euo pipefail

          test -d Bin
          test -d Patches

          cat > Bin/clean_hook.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          rm -rf drivers/kernelsu
          rm -rf KernelSU
          rm -rf KernelSU-Next

          rm -f clean_hook.sh
          SH

          chmod +x Bin/clean_hook.sh

      - name: Prepare compilation environment
        uses: ./.github/workflows/build-env

      - name: Adapt SukiSU fix patch for builtin branch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_FILE="/tmp/Patches/Patch/sukisu_ultra_fixed.patch"
          test -f "$PATCH_FILE"

          python3 - <<'PY'
          from pathlib import Path

          patch_file = Path("/tmp/Patches/Patch/sukisu_ultra_fixed.patch")
          lines = patch_file.read_text().splitlines(keepends=True)

          result = []
          skip_section = False
          found = False

          for line in lines:
              if line.startswith("diff --git "):
                  skip_section = (
                      line.startswith(
                          "diff --git a/runtime/ksud.c b/runtime/ksud.c"
                      )
                  )
                  if skip_section:
                      found = True

              if not skip_section:
                  result.append(line)

          if not found:
              raise SystemExit(
                  "ERROR: runtime/ksud.c section not found in SukiSU patch"
              )

          patch_file.write_text("".join(result))
          print(
              "Removed only the stale runtime/ksud.c patch section; "
              "all other patch sections are preserved."
          )
          PY

      # This action downloads the kernel source, toolchains and SukiSU.
      - name: Get kernel, toolchains and SukiSU
        uses: ./.github/workflows/build-ready

      - name: Restore missing SukiSU arch.h
        shell: bash
        run: |
          set -euo pipefail

          KSU_DIR="$GITHUB_WORKSPACE/device_kernel/KernelSU/kernel"

          test -f "$KSU_DIR/kernel_includes.h"
          mkdir -p "$KSU_DIR/include"

          curl -fsSL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/e564e16f99038d0b0cf560bec937c99c92c89481/kernel/include/arch.h" \
            -o "$KSU_DIR/include/arch.h"

          grep -q 'defined(__aarch64__)' "$KSU_DIR/include/arch.h"
          grep -q 'REBOOT_SYMBOL "__arm64_sys_reboot"' \
            "$KSU_DIR/include/arch.h"

          echo "SukiSU ARM64 arch.h restored and verified."

      - name: Fix SukiSU KPM access_ok for Linux 4.19
        shell: bash
        run: |
          set -euo pipefail

          KPM_C="$GITHUB_WORKSPACE/device_kernel/drivers/kernelsu/kpm/kpm.c"
          test -f "$KPM_C"

          python3 - "$KPM_C" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          replacements = [
              (
                  "access_ok(arg1, 255)",
                  "access_ok(VERIFY_READ, (void __user *)arg1, 255)",
                  1,
              ),
              (
                  "access_ok(arg2, 255)",
                  "access_ok(VERIFY_READ, (void __user *)arg2, 255)",
                  1,
              ),
              (
                  "access_ok(arg1, sizeof(kernel_name_buffer))",
                  "access_ok(VERIFY_READ, (void __user *)arg1, sizeof(kernel_name_buffer))",
                  2,
              ),
              (
                  "access_ok(arg2, size)",
                  "access_ok(VERIFY_WRITE, (void __user *)arg2, size)",
                  1,
              ),
              (
                  # The LIST output buffer is arg1; arg2 is its length.
                  "access_ok(arg2, len)",
                  "access_ok(VERIFY_WRITE, (void __user *)arg1, len)",
                  1,
              ),
              (
                  "access_ok(arg1, sizeof(kpm_name))",
                  "access_ok(VERIFY_READ, (void __user *)arg1, sizeof(kpm_name))",
                  1,
              ),
              (
                  "access_ok(arg2, sizeof(kpm_args))",
                  "access_ok(VERIFY_READ, (void __user *)arg2, sizeof(kpm_args))",
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"Unexpected count for {old!r}: "
                      f"expected {expected}, got {count}"
                  )
              text = text.replace(old, new)

          old_control = r'''    if (!access_ok(cmd.control_code, sizeof(int))) {
                  pr_err("kpm: invalid control_code pointer %px\n",
                         (void *)cmd.control_code);
                  return -EFAULT;
              }'''
          new_control = r'''    if (!sukisu_is_kpm_control_code(cmd.control_code)) {
                  pr_err("kpm: invalid control code %lu\n",
                         (unsigned long)cmd.control_code);
                  return -EINVAL;
              }'''

          if text.count(old_control) != 1:
              raise SystemExit("Could not uniquely find the KPM control-code check.")
          text = text.replace(old_control, new_control)

          old_result = r'''    if (!access_ok(cmd.result_code, sizeof(int))) {
                  pr_err("kpm: invalid result_code pointer %px\n",
                         (void *)cmd.result_code);
                  return -EFAULT;
              }'''
          new_result = r'''    if (!access_ok(VERIFY_WRITE,
                         (void __user *)cmd.result_code, sizeof(int))) {
                  pr_err("kpm: invalid result_code pointer %px\n",
                         (void *)cmd.result_code);
                  return -EFAULT;
              }'''

          if text.count(old_result) != 1:
              raise SystemExit("Could not uniquely find the KPM result-code check.")
          text = text.replace(old_result, new_result)

          if "access_ok(arg1," in text or "access_ok(arg2," in text:
              raise SystemExit("A two-argument access_ok call remains.")

          path.write_text(text)
          print(f"Patched KPM compatibility in {path}")
          PY

          echo "Verifying KPM compatibility patch..."
          ! grep -nE 'access_ok\((arg1|arg2|cmd\.control_code|cmd\.result_code),' "$KPM_C"
          echo "KPM access_ok checks adapted for Linux 4.19."
      
      - name: Upgrade SUSFS core to v2.3.0 for SukiSU
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          # Fetch enough history to reverse the two old SUSFS commits.
          git fetch --depth=40 origin sukisu-dev

          git cat-file -e \
            f8ed6712823b7535346d8a05e898555b548fc9ac^{commit}
          git cat-file -e \
            8816588aef937a14d9af639b1c75450bcdb24f6f^{commit}

          # The old source contains SUSFS v1.5.7.
          # Deinitialize its old SUSFS submodule before reverting.
          git submodule deinit -f -- susfs4ksu >/dev/null 2>&1 || true
          rm -rf susfs4ksu

          # Revert v1.5.7 first, then its original SUSFS integration.
          # Revert v1.5.7 first, then its original SUSFS integration.
          # Resolve overlapping hunks in favor of the SUSFS removal.
          if ! git revert --no-commit -X theirs \
            f8ed6712823b7535346d8a05e898555b548fc9ac \
            8816588aef937a14d9af639b1c75450bcdb24f6f; then
            echo "ERROR: failed to revert old SUSFS integration."
            git status --short
            git ls-files -u || true
            git revert --abort || true
            exit 1
          fi
          
          # Fail explicitly if any unresolved index conflicts remain.
          if git ls-files -u | grep -q .; then
            echo "ERROR: unresolved conflicts remain."
            git status --short
            git ls-files -u
            exit 1
          fi

          test ! -e fs/susfs.c
          test ! -e include/linux/susfs.h
          test ! -e include/linux/susfs_def.h

          PATCH_BASE="https://raw.githubusercontent.com/lykwzzwzss/pipa-n0-resukisu-build/ef4ed9cacc97e502ae8914bf34e77523b7def42a/patches"

          curl -fsSL --retry 3 --retry-delay 2 \
            "$PATCH_BASE/susfs-4.19.patch" \
            -o /tmp/susfs-4.19.patch

          curl -fsSL --retry 3 --retry-delay 2 \
            "$PATCH_BASE/susfs-inline-hooks.sh" \
            -o /tmp/susfs-inline-hooks.sh

          # Do not continue if the patch cannot be applied cleanly.
          if ! patch --batch --forward --fuzz=3 -p1 \
            < /tmp/susfs-4.19.patch \
            > /tmp/susfs-4.19-patch.log 2>&1; then
            cat /tmp/susfs-4.19-patch.log
            find . -name '*.rej' -print
            echo "ERROR: SUSFS v2.3.0 patch failed."
            exit 1
          fi

          if find . -name '*.rej' -print -quit | grep -q .; then
            cat /tmp/susfs-4.19-patch.log
            find . -name '*.rej' -print
            echo "ERROR: SUSFS patch has rejected hunks."
            exit 1
          fi

          # Add the SukiSU/SUSFS hooks appropriate for this kernel.
          if ! bash /tmp/susfs-inline-hooks.sh \
            > /tmp/susfs-inline-hooks.log 2>&1; then
            cat /tmp/susfs-inline-hooks.log
            exit 1
          fi
          cat /tmp/susfs-inline-hooks.log

          # Check that the new implementation matches the SukiSU API.
          test -f fs/susfs.c
          grep -q 'SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          grep -q 'SUSFS_MAGIC' include/linux/susfs_def.h
          grep -q 'CMD_SUSFS_ADD_SUS_PATH_LOOP' include/linux/susfs_def.h
          grep -q 'CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS' include/linux/susfs_def.h
          grep -q 'CMD_SUSFS_ADD_SUS_MAP' include/linux/susfs_def.h
          grep -q 'CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING' include/linux/susfs_def.h

          grep -q 'susfs_add_sus_path_loop' include/linux/susfs.h
          grep -q 'susfs_set_hide_sus_mnts_for_non_su_procs' include/linux/susfs.h
          grep -q 'susfs_add_sus_map' include/linux/susfs.h
          grep -q 'susfs_set_avc_log_spoofing' include/linux/susfs.h

          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c
          grep -q 'ksu_handle_setresuid' kernel/sys.c

          echo "SUSFS v2.3.0 core and SukiSU hooks verified."

      - name: Fix SUSFS fdinfo mask build error
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("fs/notify/fdinfo.c")
          if not path.is_file():
              raise SystemExit("ERROR: fdinfo.c not found")

          text = path.read_text()

          # Restrict the change to inotify_fdinfo(), not fanotify.
          start = text.find("static void inotify_fdinfo(")
          end = text.find("void inotify_show_fdinfo", start)

          if start < 0 or end < 0:
              raise SystemExit(
                  "ERROR: could not isolate inotify_fdinfo()"
              )

          func = text[start:end]
          old = "mask, mark->ignored_mask);"
          new = "mark->mask & IN_ALL_EVENTS, mark->ignored_mask);"

          count = func.count(old)

          if count:
              func = func.replace(old, new)

              # Remove the old declaration if no longer needed.
              func, removed = re.subn(
                  r"(?m)^[ \t]*u32 mask = mark->mask & IN_ALL_EVENTS;[ \t]*\n",
                  "",
                  func,
              )

              text = text[:start] + func + text[end:]
              path.write_text(text)

              print(
                  f"Fixed {count} inotify reference(s); "
                  f"removed {removed} obsolete declaration(s)."
              )
          elif new in func:
              print("inotify_fdinfo() fix is already present.")
          else:
              raise SystemExit(
                  "ERROR: no expected stale mask reference "
                  "inside inotify_fdinfo()."
              )

          # Verify the result.
          text = path.read_text()
          start = text.find("static void inotify_fdinfo(")
          end = text.find("void inotify_show_fdinfo", start)
          func = text[start:end]

          if old in func:
              raise SystemExit(
                  "ERROR: stale inotify mask reference remains."
              )

          if new not in func:
              raise SystemExit(
                  "ERROR: inotify mask replacement did not verify."
              )

          # Verify fanotify's mark->mask expression was not damaged.
          fan_start = text.find("static void fanotify_fdinfo(")
          if fan_start >= 0:
              if (
                  "mark->mask, mark->ignored_mask);"
                  not in text[fan_start:]
              ):
                  raise SystemExit(
                      "ERROR: fanotify code appears changed unexpectedly."
                  )

          print("fdinfo.c inotify-only mask compatibility check passed.")
          PY

      - name: Fix SUSFS STATX KSTAT definitions
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          python3 - <<'PY'
          import re
          from pathlib import Path

          header = Path("include/linux/susfs_def.h")
          stat = Path("fs/stat.c")

          if not header.is_file():
              raise SystemExit("ERROR: SUSFS definition header not found")
          if not stat.is_file():
              raise SystemExit("ERROR: fs/stat.c not found")

          definitions = (
              ("STATX_SUS_KSTAT", "0x10000000U"),
              ("STATX_SUS_KSTAT_FUSE", "0x20000000U"),
          )

          # Ensure the internal SUSFS flags exist in susfs_def.h.
          htext = header.read_text()

          for name, value in definitions:
              pattern = re.compile(
                  r"(?m)^[ \t]*#define[ \t]+"
                  + re.escape(name)
                  + r"[ \t]+([^\s/]+)"
              )
              found = pattern.findall(htext)

              if len(found) > 1:
                  raise SystemExit(
                      f"ERROR: duplicate {name} definitions"
                  )

              if found:
                  if found[0] != value:
                      raise SystemExit(
                          f"ERROR: unexpected {name} value: {found[0]}"
                      )
                  continue

              closing = list(
                  re.finditer(r"(?m)^[ \t]*#endif\b.*$", htext)
              )
              if not closing:
                  raise SystemExit(
                      "ERROR: SUSFS header closing #endif not found"
                  )

              pos = closing[-1].start()
              htext = (
                  htext[:pos]
                  + f"#define {name} {value}\n"
                  + htext[pos:]
              )

          header.write_text(htext)

          # Add guarded fallback definitions directly to fs/stat.c.
          # This also protects against include/config visibility differences.
          marker = "#include <asm/unistd.h>"
          tag = "/* SUSFS STATX fallback definitions for this kernel. */"

          stext = stat.read_text()

          if tag not in stext:
              if stext.count(marker) != 1:
                  raise SystemExit(
                      "ERROR: could not locate fs/stat.c include anchor"
                  )

              fallback = """
          /* SUSFS STATX fallback definitions for this kernel. */
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
          #ifndef STATX_SUS_KSTAT
          #define STATX_SUS_KSTAT 0x10000000U
          #endif
          #ifndef STATX_SUS_KSTAT_FUSE
          #define STATX_SUS_KSTAT_FUSE 0x20000000U
          #endif
          #endif
          """

              pos = stext.index(marker) + len(marker)
              stext = stext[:pos] + "\n" + fallback + stext[pos:]
              stat.write_text(stext)

          # Verify the header definitions and fallback block.
          htext = header.read_text()
          stext = stat.read_text()

          for name, value in definitions:
              pattern = re.compile(
                  r"(?m)^[ \t]*#define[ \t]+"
                  + re.escape(name)
                  + r"[ \t]+([^\s/]+)"
              )
              if pattern.findall(htext) != [value]:
                  raise SystemExit(
                      f"ERROR: {name} verification failed"
                  )

          if tag not in stext:
              raise SystemExit(
                  "ERROR: fs/stat.c fallback block missing"
              )

          print("SUSFS STATX KSTAT definitions verified.")
          PY

      # Verify the Linux 4.19 hook patch already present in your kernel repo.
      - name: Verify PEYM00 SukiSU hooks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          echo "Checking existing SukiSU hooks..."

          grep -q 'ksu_handle_execveat_sucompat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_sys_read' fs/read_write.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_input_handle_event' drivers/input/input.c
          grep -q 'ksu_handle_devpts' drivers/tty/pty.c

          echo "All required SukiSU hooks are already present."

      # Enable the SUSFS options without applying a second SUSFS core patch.
     
      - name: Enable SUSFS v2.3.0 and KPM configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          CFG="arch/arm64/configs/${DEFCONFIG_NAME}"
          test -f "$CFG"
          test -f fs/susfs.c
          grep -q 'SUSFS_VERSION "v2.3.0"' include/linux/susfs.h

          # Remove stale and duplicate SUSFS/KPM definitions.
          python3 - "$CFG" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          pattern = re.compile(
              r"^\s*(?:"
              r"CONFIG_KSU(?:_DEBUG)?|"
              r"CONFIG_KPM|"
              r"CONFIG_KALLSYMS(?:_ALL)?|"
              r"CONFIG_KSU_SUSFS(?:_[A-Z0-9_]+)?"
              r")\s*="
          )
          not_set = re.compile(
              r"^\s*#\s*(?:"
              r"CONFIG_KSU(?:_DEBUG)?|"
              r"CONFIG_KPM|"
              r"CONFIG_KALLSYMS(?:_ALL)?|"
              r"CONFIG_KSU_SUSFS(?:_[A-Z0-9_]+)?"
              r")\s+is not set\s*$"
          )

          lines = path.read_text().splitlines()
          lines = [
              line for line in lines
              if not pattern.match(line) and not not_set.match(line)
          ]
          path.write_text("\n".join(lines).rstrip() + "\n")
          PY

          cat >> "$CFG" <<'EOF'

          # SukiSU + SUSFS v2.3.0
          CONFIG_KSU=y
          # CONFIG_KSU_DEBUG is not set

          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y

          # Keep SukiSU KPM enabled.
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          grep -qx 'CONFIG_KSU=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_PATH=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MOUNT=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_KSTAT=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_ENABLE_LOG=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$CFG"
          grep -qx 'CONFIG_KSU_SUSFS_SUS_MAP=y' "$CFG"
          grep -qx 'CONFIG_KPM=y' "$CFG"
          grep -qx 'CONFIG_KALLSYMS=y' "$CFG"
          grep -qx 'CONFIG_KALLSYMS_ALL=y' "$CFG"

          echo "SUSFS v2.3.0 and KPM config verified."

      - name: Build kernel
        uses: ./.github/workflows/build-process

      - name: Pack AnyKernel3
        uses: ./.github/workflows/pack-process

      - name: Upload kernel package
        uses: ./.github/workflows/upload-files
