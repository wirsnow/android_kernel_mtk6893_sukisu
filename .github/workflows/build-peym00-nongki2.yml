name: Build OPPO K9 Pro PEYM00 (NonGKI v2)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: OPPO K9 Pro / ColorOS 13 / Linux 4.19
    runs-on: ubuntu-22.04
    env:
      # OPPO K9 Pro (PEYM00), MT6893, ColorOS 13 / Android 13
      DEVICE_NAME: "oppo_k9pro_cn"
      DEVICE_CODENAME: "peym00"

      # Keep the toolchain used by the existing working kernel workflow.
      CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
      EXTRA_CMDS: "LD=ld.lld"

      KERNEL_SOURCE: "https://github.com/wirsnow/android_kernel_mtk6893_sukisu.git"
      KERNEL_BRANCH: "sukisu-dev"

      CLANG_SOURCE: "https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078.git"
      CLANG_BRANCH: "10.0"

      GCC_GNU: "false"
      GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
      GCC_64_BRANCH: ""
      GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
      GCC_32_BRANCH: ""

      DEFCONFIG_SOURCE: ""
      DEFCONFIG_NAME: "mtk6893_defconfig"
      DEFCONFIG_ORIGIN_IMAGE: ""
      DEFCONFIG_FROM_BOOT: "false"

      KERNELSU_SOURCE: ""
      KERNELSU_BRANCH: ""
      KERNELSU_AUTO_GET: "true"
      KERNELSU_AUTO_FORK: "sukisu"
      KERNELSU_METHOD: "shell"

      # The source branch already contains SUSFS v1.5.7. Keep it enabled;
      # do not stack the framework's generic SUSFS v2.2 patch on top of it.
      SUSFS_ENABLE: "true"
      SUSFS_FIXED: "false"

      AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
      AK3_BRANCH: "master"
      BOOT_SOURCE: ""

      NEED_DTBO: "false"
      NEED_SAFE_DTBO: "false"
      ROM_TEXT: "coloros13_a13_sukisu_susfs157"

      PYTHON_VERSION: "3"
      PACK_METHOD: "AnyKernel3"
      PACK_KMODULES: "false"

      PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
      PATCHES_BRANCH: "main"
      SUSFS_FOLDER_FIXED: ""
      SUSFS_PATCH_FIXED: ""

      REKERNEL_ENABLE: "false"
      DROIDSPACES_ENABLE: "false"
      NOMOUNT_ENABLE: "false"
      HOOK_METHOD: "syscall"

      # Start conservatively: no KPM / inline-hook patching for this first build.
      KPM_ENABLE: "false"
      KPM_INLINE: "false"
      KPM_KPATCH_NEXT: "false"
      KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

      BASEBAND_GUARD_ENABLE: "false"
      BASEBAND_GUARD_BOOT: "false"
      GENERATE_DTB: "false"
      GENERATE_CHIP: "mediatek"

      BUILD_DEBUGGER: "true"
      SKIP_PATCH: "false"
      BUILD_OTHER_CONFIG: "false"
      MERGE_CONFIG_FILES: ""
      FREE_MORE_SPACE: "false"

    steps:
      # This workflow lives in the kernel repo, but uses the reusable build
      # components from NonGKI_Kernel_Build_2nd.
      - name: Checkout NonGKI Kernel Build v2 framework
        uses: actions/checkout@v4
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: c8aa2399d72135bf66e241eed0c456c221901c83
          persist-credentials: false

      # The framework normally strips SUSFS before applying its generic v2.2
      # patch. This source already has a working v1.5.7 integration, so replace
      # that cleanup script for this job: remove only stale KernelSU folders.
      - name: Preserve source-integrated SUSFS v1.5.7
        shell: bash
        run: |
          cat > Bin/clean_hook.sh <<'SH'
          #!/usr/bin/env bash
          set -e
          rm -rf drivers/kernelsu KernelSU KernelSU-Next
          rm -f clean_hook.sh
          SH
          chmod +x Bin/clean_hook.sh

      - name: Prepare compilation environment
        uses: JackA1ltman/NonGKI_Kernel_Build_2nd/.github/workflows/build-env@c8aa2399d72135bf66e241eed0c456c221901c83

      - name: Get kernel, toolchains, and SukiSU
        uses: JackA1ltman/NonGKI_Kernel_Build_2nd/.github/workflows/build-ready@c8aa2399d72135bf66e241eed0c456c221901c83

      - name: Detect existing SUSFS integration and set config
        uses: JackA1ltman/NonGKI_Kernel_Build_2nd/.github/workflows/patch-susfs@c8aa2399d72135bf66e241eed0c456c221901c83

      # This Linux 4.19 tree has its own SukiSU hook patch. Do not run
      # patch-no-kprobe here: that action selects the framework's newer
      # SUSFS inline-hook patch when SUSFS_ENABLE=true.
      - name: Apply PEYM00 SukiSU hooks for Linux 4.19
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          test -f ksu_hooks_sukisu_4.19.patch
          patch --dry-run -p1 < ksu_hooks_sukisu_4.19.patch
          patch -p1 < ksu_hooks_sukisu_4.19.patch

      - name: Build kernel
        uses: JackA1ltman/NonGKI_Kernel_Build_2nd/.github/workflows/build-process@c8aa2399d72135bf66e241eed0c456c221901c83

      - name: Pack AnyKernel3
        uses: JackA1ltman/NonGKI_Kernel_Build_2nd/.github/workflows/pack-process@c8aa2399d72135bf66e241eed0c456c221901c83

      - name: Upload kernel package
        uses: JackA1ltman/NonGKI_Kernel_Build_2nd/.github/workflows/upload-files@c8aa2399d72135bf66e241eed0c456c221901c83
