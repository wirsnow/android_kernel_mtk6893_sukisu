name: Build OPPO K9 Pro PEYM00 (NonGKI v2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kernel:
    name: OPPO K9 Pro / ColorOS 13 / Linux 4.19
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      DEVICE_NAME: "oppo_k9pro_cn"
      DEVICE_CODENAME: "peym00"

      CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
      EXTRA_CMDS: "LD=ld.lld"

      # OPPO K9 Pro MT6893 kernel
      KERNEL_SOURCE: "https://github.com/wirsnow/android_kernel_mtk6893_sukisu.git"
      KERNEL_BRANCH: "sukisu-dev"

      # Keep the toolchains from the existing working build
      CLANG_SOURCE: "https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078.git"
      CLANG_BRANCH: "10.0"

      GCC_GNU: "false"
      GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
      GCC_64_BRANCH: ""
      GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
      GCC_32_BRANCH: ""

      DEFCONFIG_SOURCE: ""
      DEFCONFIG_NAME: "mtk6893_defconfig"
      DEFCONFIG_ORIGIN_IMAGE: ""
      DEFCONFIG_FROM_BOOT: "false"

      # Install SukiSU using the framework's built-in setup
      KERNELSU_SOURCE: ""
      KERNELSU_BRANCH: ""
      KERNELSU_AUTO_GET: "true"
      KERNELSU_AUTO_FORK: "sukisu"
      KERNELSU_METHOD: "shell"

      # The selected kernel source contains SUSFS v1.5.7 integration.
      # Do not run the framework's generic SUSFS v2.2 patch action.
      SUSFS_ENABLE: "true"
      SUSFS_FIXED: "false"

      AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
      AK3_BRANCH: "master"
      BOOT_SOURCE: ""

      NEED_DTBO: "false"
      NEED_SAFE_DTBO: "false"
      ROM_TEXT: "coloros13_a13_sukisu_susfs157"

      PYTHON_VERSION: "3"
      PACK_METHOD: "AnyKernel3"
      PACK_KMODULES: "false"

      PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
      PATCHES_BRANCH: "main"
      SUSFS_FOLDER_FIXED: ""
      SUSFS_PATCH_FIXED: ""

      REKERNEL_ENABLE: "false"
      DROIDSPACES_ENABLE: "false"
      NOMOUNT_ENABLE: "false"
      HOOK_METHOD: "syscall"

      # Conservative initial build: disable experimental KPM hooks
      KPM_ENABLE: "false"
      KPM_INLINE: "false"
      KPM_KPATCH_NEXT: "false"
      KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

      BASEBAND_GUARD_ENABLE: "false"
      BASEBAND_GUARD_BOOT: "false"
      GENERATE_DTB: "false"
      GENERATE_CHIP: "mediatek"

      BUILD_DEBUGGER: "true"
      SKIP_PATCH: "false"
      BUILD_OTHER_CONFIG: "false"
      MERGE_CONFIG_FILES: ""
      FREE_MORE_SPACE: "false"

    steps:
      # Check out the NonGKI v2 framework into the workspace root.
      # Its composite actions are called through local paths below.
      - name: Checkout NonGKI Kernel Build v2
        uses: actions/checkout@v4
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          ref: c8aa2399d72135bf66e241eed0c456c221901c83
          persist-credentials: false

      # Keep the kernel's existing SUSFS source; remove only old KernelSU
      # directories before the framework installs SukiSU.
      - name: Preserve existing SUSFS v1.5.7 integration
        shell: bash
        run: |
          set -euo pipefail

          test -d Bin
          test -d Patches

          cat > Bin/clean_hook.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          rm -rf drivers/kernelsu
          rm -rf KernelSU
          rm -rf KernelSU-Next

          rm -f clean_hook.sh
          SH

          chmod +x Bin/clean_hook.sh

      - name: Prepare compilation environment
        uses: ./.github/workflows/build-env

      - name: Adapt SukiSU fix patch for builtin branch
        shell: bash
        run: |
          set -euo pipefail

          PATCH_FILE="/tmp/Patches/Patch/sukisu_ultra_fixed.patch"
          test -f "$PATCH_FILE"

          python3 - <<'PY'
          from pathlib import Path

          patch_file = Path("/tmp/Patches/Patch/sukisu_ultra_fixed.patch")
          lines = patch_file.read_text().splitlines(keepends=True)

          result = []
          skip_section = False
          found = False

          for line in lines:
              if line.startswith("diff --git "):
                  skip_section = (
                      line.startswith(
                          "diff --git a/runtime/ksud.c b/runtime/ksud.c"
                      )
                  )
                  if skip_section:
                      found = True

              if not skip_section:
                  result.append(line)

          if not found:
              raise SystemExit(
                  "ERROR: runtime/ksud.c section not found in SukiSU patch"
              )

          patch_file.write_text("".join(result))
          print(
              "Removed only the stale runtime/ksud.c patch section; "
              "all other patch sections are preserved."
          )
          PY

      # This action downloads the kernel source, toolchains and SukiSU.
      - name: Get kernel, toolchains and SukiSU
        uses: ./.github/workflows/build-ready

      # Apply the Linux 4.19 hook patch already present in your kernel repo.
      - name: Apply PEYM00 SukiSU hooks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          test -f ksu_hooks_sukisu_4.19.patch

          patch --dry-run -p1 < ksu_hooks_sukisu_4.19.patch
          patch -p1 < ksu_hooks_sukisu_4.19.patch

      # Enable the SUSFS options without applying a second SUSFS core patch.
      - name: Enable SUSFS v1.5.7 configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          CFG="arch/arm64/configs/${DEFCONFIG_NAME}"
          test -f "$CFG"
          test -f fs/susfs.c
          grep -q 'SUSFS_VERSION "v1.5.7"' include/linux/susfs.h

          cat >> "$CFG" <<'EOF'

          # SUSFS v1.5.7 configuration for OPPO K9 Pro
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          echo "SUSFS v1.5.7 checks passed; configuration appended."

      - name: Build kernel
        uses: ./.github/workflows/build-process

      - name: Pack AnyKernel3
        uses: ./.github/workflows/pack-process

      - name: Upload kernel package
        uses: ./.github/workflows/upload-files
